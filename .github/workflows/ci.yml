name: CI

# There is deliberately no job for the tests that act on a compositor session
# (`niri-live-{action,layershell,restart,shell-restart}-test`). A GitHub-hosted runner has no Wayland
# session, no display and no DRM device, and niri cannot be run headless: it needs a compositor to be
# nested inside or a device to drive, and `niri --help` offers no backend that avoids both. Registering
# them anyway would be worse than leaving them out, because they skip themselves with a reason when
# `$NIRI_SOCKET` is unset — the job would pass having checked nothing, which is the failure
# `public-names-test` exists to catch in a `ctest -R` that matches no test. They are run where a session
# exists instead: `ctest --preset session`, which registers the four and exits 8 rather than reporting a
# pass when none of them is registered. The one live test that needs no compositor is `audio-live-test`,
# and the job below does carry it: it installs the `pipewire` package and gives the test a scratch
# `XDG_RUNTIME_DIR`, both of which a runner image lacks and both of which the test needs
# (QUANTUM_SHELL.md § Quality Gates, Testing and CI § CI). What no job carries is the layer-shell path,
# which needs a compositor and therefore a runner that has one — a self-hosted machine with a session, or
# a compositor the suite speaks the protocol to from inside its own process, which is the only way a
# hosted runner could exercise the protocol at all.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build and test (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: g++
            c-compiler: gcc
          - compiler: clang++
            c-compiler: clang
    env:
      # The C++ compiler is what the matrix varies. `CC` must be the matching C compiler rather than
      # the same string: the project enables C for wayland-scanner's output, and CMake refuses a C++
      # compiler as `CMAKE_C_COMPILER` ("The CMAKE_C_COMPILER is set to a C++ compiler"), which is
      # what a `CC: g++` matrix produced — found by running this workflow's steps locally, where the
      # configure step failed before building anything.
      CC: ${{ matrix.c-compiler }}
      CXX: ${{ matrix.compiler }}
    steps:
      - name: Check out
        uses: actions/checkout@v5

      # The CMake shipped in the runner image can predate the 3.31 floor this project requires, so
      # the version is pinned here rather than inherited from the image.
      - name: Install CMake 4.4.3
        run: |
          curl -fsSL -o /tmp/cmake.tar.gz \
            https://github.com/Kitware/CMake/releases/download/v4.4.3/cmake-4.4.3-linux-x86_64.tar.gz
          tar -xzf /tmp/cmake.tar.gz -C /tmp
          echo "/tmp/cmake-4.4.3-linux-x86_64/bin" >> "$GITHUB_PATH"

      # The Qt in the runner image is older than this project's floor, and the floor is pinned rather
      # than inferred: building against a different Qt minor is the failure mode the risk register
      # calls out.
      # The runner image has neither the Wayland development files Qt6WaylandClient's config needs nor a
      # PipeWire at the 1.6 floor (Ubuntu 24.04 ships 1.0.5), so the first is installed from apt and the
      # second is built from its 1.6.0 release tag into a cached prefix. The floor is not lowered.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libwayland-bin wayland-protocols pkg-config \
            libxkbcommon-dev libdbus-1-dev dbus meson ninja-build libglib2.0-dev

      - name: Cache PipeWire 1.6.0
        id: pipewire-cache
        uses: actions/cache@v4
        with:
          path: /opt/pipewire
          key: pipewire-1.6.0-${{ runner.os }}-v1

      - name: Build PipeWire 1.6.0
        if: steps.pipewire-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch 1.6.0 https://gitlab.freedesktop.org/pipewire/pipewire.git /tmp/pipewire-src
          meson setup /tmp/pipewire-build /tmp/pipewire-src --prefix=/opt/pipewire --libdir=lib \
            -Dbuildtype=release -Dtests=disabled -Dexamples=disabled -Ddocs=disabled -Dman=disabled \
            -Dsession-managers=[] -Dgstreamer=disabled -Dpw-cat=disabled -Dvulkan=disabled \
            -Dbluez5=disabled -Dlibcamera=disabled -Dv4l2=disabled -Dpipewire-v4l2=disabled \
            -Dalsa=disabled -Djack=disabled -Dpipewire-jack=disabled -Dsdl2=disabled -Dlibusb=disabled
          ninja -C /tmp/pipewire-build install

      - name: Install Qt 6.11.2
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.11.2
          cache: true

      - name: Point the build at PipeWire 1.6.0
        run: |
          echo "PKG_CONFIG_PATH=/opt/pipewire/lib/pkgconfig:${PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/opt/pipewire/lib:${LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Show toolchain
        run: |
          cmake --version
          "$CXX" --version | head -1
          qmake6 --version | tail -1 || true

      - name: Configure
        run: cmake --preset ci

      - name: Build
        run: cmake --build --preset ci

      # The gate on its own, so a violation is readable in the job log instead of only appearing as a
      # failing test. It runs again inside ctest, which is the copy that fails the build.
      - name: Repository scan
        # The same five requirements the `repo-scan` test passes, so the readable copy and the failing one
        # agree: a directory required in one and not the other is a difference nobody would notice, since
        # this step is only here to make a violation legible in the job log.
        run: ./build/ci/qs-scan --root . --require tools --require CMakeLists.txt --require src --require qml --require tests --list

      - name: Test
        run: ctest --preset ci

      # The one live test a hosted runner can carry, because it needs no compositor: it starts a PipeWire
      # daemon of its own in a scratch directory and drives it through pw-cli, pw-metadata and pw-dump while
      # the shell's own client is the code under test. What it does need is the `pipewire` package and an
      # `XDG_RUNTIME_DIR`, which a runner image has neither of — PipeWire refuses to create its socket
      # without a runtime dir ("name ... is not an absolute path and no runtime dir found"), which is what
      # this step's export is for, verified by running the test with a scratch runtime dir on the machine
      # this was developed on.
      - name: Audio against a real daemon
        run: |
          sudo apt-get install -y pipewire
          export XDG_RUNTIME_DIR=$(mktemp -d)
          QS_AUDIO_TESTS=1 cmake --preset ci
          ctest --preset ci -R audio-live-test

  sanitizers:
    name: sanitizers
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Install CMake 4.4.3
        run: |
          curl -fsSL -o /tmp/cmake.tar.gz \
            https://github.com/Kitware/CMake/releases/download/v4.4.3/cmake-4.4.3-linux-x86_64.tar.gz
          tar -xzf /tmp/cmake.tar.gz -C /tmp
          echo "/tmp/cmake-4.4.3-linux-x86_64/bin" >> "$GITHUB_PATH"

      # The runner image has neither the Wayland development files Qt6WaylandClient's config needs nor a
      # PipeWire at the 1.6 floor (Ubuntu 24.04 ships 1.0.5), so the first is installed from apt and the
      # second is built from its 1.6.0 release tag into a cached prefix. The floor is not lowered.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libwayland-bin wayland-protocols pkg-config \
            libxkbcommon-dev libdbus-1-dev dbus meson ninja-build libglib2.0-dev

      - name: Cache PipeWire 1.6.0
        id: pipewire-cache
        uses: actions/cache@v4
        with:
          path: /opt/pipewire
          key: pipewire-1.6.0-${{ runner.os }}-v1

      - name: Build PipeWire 1.6.0
        if: steps.pipewire-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch 1.6.0 https://gitlab.freedesktop.org/pipewire/pipewire.git /tmp/pipewire-src
          meson setup /tmp/pipewire-build /tmp/pipewire-src --prefix=/opt/pipewire --libdir=lib \
            -Dbuildtype=release -Dtests=disabled -Dexamples=disabled -Ddocs=disabled -Dman=disabled \
            -Dsession-managers=[] -Dgstreamer=disabled -Dpw-cat=disabled -Dvulkan=disabled \
            -Dbluez5=disabled -Dlibcamera=disabled -Dv4l2=disabled -Dpipewire-v4l2=disabled \
            -Dalsa=disabled -Djack=disabled -Dpipewire-jack=disabled -Dsdl2=disabled -Dlibusb=disabled
          ninja -C /tmp/pipewire-build install

      - name: Install Qt 6.11.2
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.11.2
          cache: true

      - name: Point the build at PipeWire 1.6.0
        run: |
          echo "PKG_CONFIG_PATH=/opt/pipewire/lib/pkgconfig:${PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/opt/pipewire/lib:${LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake --preset asan

      - name: Build
        run: cmake --build --preset asan

      - name: Test
        run: ctest --preset asan
